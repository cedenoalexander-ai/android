<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with rounded corners (safe zone compliant) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border glow -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#fde68a" stroke-width="4" stroke-opacity="0.25" />

  <!-- Main Illustration Group -->
  <g filter="url(#shadow)" transform="translate(0, -6)">
    <!-- Chef Hat Base -->
    <path d="M196 160 C170 160 150 135 165 110 C180 85 220 80 240 100 C250 70 290 65 310 95 C330 75 365 90 360 120 C375 140 360 160 336 160 Z" fill="url(#creamGrad)" />
    <!-- Hat band with gold accent -->
    <rect x="186" y="150" width="140" height="20" rx="10" fill="url(#goldGrad)" />

    <!-- Cake Top Tier -->
    <path d="M196 210 L316 210 C322 210 326 215 326 220 L320 260 C320 266 314 270 308 270 L204 270 C198 270 192 266 192 260 L186 220 C186 215 190 210 196 210 Z" fill="url(#creamGrad)" />
    <!-- Top Tier Drip / Frosting -->
    <path d="M186 220 C200 232 210 220 226 230 C240 240 250 225 266 235 C280 245 295 225 310 232 C320 228 326 220 326 220" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />

    <!-- Cake Middle Base Tier -->
    <path d="M156 280 L356 280 C364 280 370 286 368 294 L356 360 C354 368 348 374 340 374 L172 374 C164 374 158 368 156 360 L144 294 C142 286 148 280 156 280 Z" fill="url(#creamGrad)" />
    <!-- Drip on Middle Tier -->
    <path d="M145 298 C165 315 185 295 205 312 C225 325 245 305 265 320 C285 330 305 305 325 318 C345 325 365 300 368 298" fill="none" stroke="#d97706" stroke-width="10" stroke-linecap="round" />

    <!-- Cake Board / Golden Base -->
    <rect x="120" y="380" width="272" height="18" rx="9" fill="url(#goldGrad)" />
    <ellipse cx="256" cy="389" rx="146" ry="12" fill="url(#goldGrad)" opacity="0.6" />

    <!-- Currency / Calculation Coin Badge on Front -->
    <g transform="translate(256, 326)">
      <circle cx="0" cy="0" r="32" fill="#78350f" stroke="#fde68a" stroke-width="4" />
      <text x="0" y="11" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="34" fill="#fef3c7" text-anchor="middle">$</text>
    </g>

    <!-- Strawberry / Cherry on Top of Hat -->
    <circle cx="256" cy="68" r="14" fill="#ef4444" />
    <path d="M256 54 C262 46 270 42 274 44" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
